root /usr/share/grommunio-admin-web;
location / {
	#root /usr/share/grommunio-admin-web;
	index index.html /index.html;
	try_files $uri /index.html;
}
location = /index.html {
	expires -1;
}
location /static/ {
	expires 1y;
}
